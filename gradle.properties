# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
# 0.18.4 is the lowest loader that supports 26.1, and also exactly what
# Fabric API 0.145.1+26.1 asks for (fabricloader >=0.18.4).
# The dev environment runs on the minimum on purpose, so that a mod accidentally
# depending on newer loader behaviour fails here rather than on a user's machine.
loader_version=0.18.4
loom_version=1.17.20

# Mod Properties
# Versioning scheme (see CONTRIBUTING.md):
#   X.Y.0 -> a major release: new mechanics or new gameplay
#   X.Y.Z -> a minor release: compatibility fixes or optimisations only
version=1.1.1
group=com.acorndelight
archives_base_name=acorns-delight

# The oldest loader the built jar will accept. Keep in sync with the "fabricloader"
# entry in src/main/resources/fabric.mod.json.
min_loader_version=0.18.4

# Dependencies
fabric_api_version=0.145.1+26.1

# Optional compatibility dependencies (compile only, never bundled into the jar)
# NB: JEI publishes one artifact per Minecraft version, so this must match minecraft_version.
jei_version=29.2.0.21
rei_version=26.1.819
rei_jar=RoughlyEnoughItems-26.1.819.jar
farmersdelight_version=26.1-3.6.21
