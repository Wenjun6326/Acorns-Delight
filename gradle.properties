# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
loader_version=0.19.5
loom_version=1.17.20

# Mod Properties
# Versioning scheme (see README.md "版本规范"):
#   X.0 -> a major release: new mechanics or new gameplay
#   X.Y -> a minor release: compatibility fixes or optimisations only
version=1.0
group=com.acorndelight
archives_base_name=acorns-delight

# Dependencies
fabric_api_version=0.145.1+26.1

# Optional compatibility dependencies (compile only, never bundled into the jar)
# NB: JEI publishes one artifact per Minecraft version, so this must match minecraft_version.
jei_version=29.2.0.21
rei_version=26.1.819
rei_jar=RoughlyEnoughItems-26.1.819.jar
farmersdelight_version=26.1-3.6.21
